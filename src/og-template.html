<!DOCTYPE html>
<!-- 用于生成 og-{en,zh,fr}.png 的模板（1200×630）。用法：og-template.html?lang=zh -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #f4f2ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
      "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #191919;
    display: flex; align-items: center; justify-content: center;
    padding: 48px;
  }
  .card {
    width: 100%; height: 100%;
    background: #fff; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .banner { height: 158px; background: linear-gradient(115deg, #0a66c2 0%, #1b7fd4 45%, #70b5f9 100%); }
  .body { flex: 1; padding: 0 56px 38px; position: relative; }
  .avatar {
    width: 156px; height: 156px; border-radius: 50%;
    border: 6px solid #fff; margin-top: -84px; background: #0a66c2;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 58px; font-weight: 700; letter-spacing: 2px;
  }
  h1 { font-size: 50px; font-weight: 700; margin-top: 14px; letter-spacing: -0.5px; }
  .headline { font-size: 24px; margin-top: 8px; color: #191919; }
  .subhead { font-size: 21px; margin-top: 2px; color: #0a66c2; font-weight: 600; }
  .loc { font-size: 19px; color: rgba(0,0,0,0.6); margin-top: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 16px; padding: 9px 20px; border-radius: 999px;
    background: #e8f3ec; color: #057642; font-size: 18px; font-weight: 600;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #01754f; }
  .langs {
    position: absolute; right: 56px; bottom: 40px;
    display: flex; gap: 10px;
  }
  .langs span {
    padding: 7px 16px; border-radius: 999px;
    background: rgba(0,0,0,0.05); font-size: 18px; color: rgba(0,0,0,0.6); font-weight: 600;
  }
  .langs span.on { background: rgba(10,102,194,0.1); color: #0a66c2; }
</style>
</head>
<body>
  <div class="card">
    <div class="banner"></div>
    <div class="body">
      <div class="avatar">BD</div>
      <h1>Benson Ding</h1>
      <p class="headline" id="headline">Economics Student @ Carleton University</p>
      <p class="subhead" id="subhead">Concentration in Computational Analysis</p>
      <p class="loc" id="loc">Ottawa, Ontario, Canada</p>
      <div class="pill"><span class="dot"></span><span id="pill">Open to economics &amp; data analyst roles · 2027</span></div>
      <div class="langs" id="langs"></div>
    </div>
  </div>
<script>
(function () {
  var T = {
    en: {
      headline: "Economics Student @ Carleton University",
      subhead: "Concentration in Computational Analysis",
      loc: "Ottawa, Ontario, Canada",
      pill: "Open to economics & data analyst roles · 2027"
    },
    zh: {
      headline: "卡尔顿大学经济学专业在读",
      subhead: "计算分析方向",
      loc: "加拿大安大略省渥太华",
      pill: "求职经济学与数据分析岗位 · 2027"
    },
    fr: {
      headline: "Étudiant en économie à l'Université Carleton",
      subhead: "Concentration en analyse computationnelle",
      loc: "Ottawa, Ontario, Canada",
      pill: "Ouvert aux rôles en économie et analyse de données · 2027"
    }
  };
  var lang = (new URLSearchParams(location.search).get("lang") || "en").toLowerCase();
  if (!T[lang]) lang = "en";
  var t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("headline").textContent = t.headline;
  document.getElementById("subhead").textContent = t.subhead;
  document.getElementById("loc").textContent = t.loc;
  document.getElementById("pill").textContent = t.pill;

  var langs = document.getElementById("langs");
  [["en", "EN"], ["fr", "FR"], ["zh", "CN"]].forEach(function (pair) {
    var s = document.createElement("span");
    s.textContent = pair[1];
    if (pair[0] === lang) s.className = "on";
    langs.appendChild(s);
  });
})();
</script>
</body>
</html>
