<!DOCTYPE html>
<!-- 用于生成 og.png 的模板（1200×630）。重新生成：见 README「社交分享预览图」 -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #f4f2ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #191919;
    display: flex; align-items: center; justify-content: center;
    padding: 48px;
  }
  .card {
    width: 100%; height: 100%;
    background: #fff; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .banner { height: 158px; background: linear-gradient(115deg, #0a66c2 0%, #1b7fd4 45%, #70b5f9 100%); }
  .body { flex: 1; padding: 0 56px 38px; position: relative; }
  .avatar {
    width: 156px; height: 156px; border-radius: 50%;
    border: 6px solid #fff; margin-top: -84px; background: #0a66c2;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 58px; font-weight: 700; letter-spacing: 2px;
  }
  h1 { font-size: 50px; font-weight: 700; margin-top: 14px; letter-spacing: -0.5px; }
  .headline { font-size: 24px; margin-top: 8px; color: #191919; }
  .subhead { font-size: 21px; margin-top: 2px; color: #0a66c2; font-weight: 600; }
  .loc { font-size: 19px; color: rgba(0,0,0,0.6); margin-top: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 16px; padding: 9px 20px; border-radius: 999px;
    background: #e8f3ec; color: #057642; font-size: 18px; font-weight: 600;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #01754f; }
  .langs {
    position: absolute; right: 56px; bottom: 40px;
    display: flex; gap: 10px;
  }
  .langs span {
    padding: 7px 16px; border-radius: 999px;
    background: rgba(0,0,0,0.05); font-size: 18px; color: rgba(0,0,0,0.6); font-weight: 600;
  }
  .langs span.on { background: rgba(10,102,194,0.1); color: #0a66c2; }
</style>
</head>
<body>
  <div class="card">
    <div class="banner"></div>
    <div class="body">
      <div class="avatar">BD</div>
      <h1>Benson Ding</h1>
      <p class="headline">Economics Student @ Carleton University</p>
      <p class="subhead">Concentration in Computational Analysis</p>
      <p class="loc">Ottawa, Ontario, Canada</p>
      <div class="pill"><span class="dot"></span>Open to economics &amp; data analyst roles · 2027</div>
      <div class="langs"><span class="on">EN</span><span>FR</span><span>CN</span></div>
    </div>
  </div>
</body>
</html>
