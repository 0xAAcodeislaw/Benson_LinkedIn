name = "benson-blockchain"
main = "src/worker.js"
compatibility_date = "2026-11-12"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "CONTENT"
id = "315a47b12be24827afd370095b2f0f88"

[[durable_objects.bindings]]
name = "VISITS"
class_name = "VisitCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitCounter"]
